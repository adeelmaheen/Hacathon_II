apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: appconfig
  namespace: default
spec:
  # Tracing disabled for now (optional)
  # tracing:
  #   samplingRate: "1"
  #   otel:
  #     endpointAddress: "http://otel-collector:4317"
  #     isSecure: false
  #     protocol: "grpc"
  httpPipeline:
    handlers:
      - name: ratelimit
        type: middleware.http.ratelimit
      - name: oauth2
        type: middleware.http.oauth2
  accessControl:
    defaultAction: allow
    trustDomain: "public"
    policies:
      - appId: todo-backend
        defaultAction: allow
        trustDomain: "public"
        operations:
          - name: /api/*
            httpVerb: ["*"]
            action: allow
      - appId: todo-frontend
        defaultAction: allow
        trustDomain: "public"
        operations:
          - name: /*
            httpVerb: ["*"]
            action: allow

