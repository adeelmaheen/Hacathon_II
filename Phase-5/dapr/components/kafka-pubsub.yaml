apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka.kafka.svc.cluster.local:9092"  # Bitnami Kafka service
    - name: consumerID
      value: "todo-service"
    - name: authType
      value: "none"
    - name: maxMessageBytes
      value: "1024"
    - name: consumeRetryInterval
      value: "200ms"

