apiVersion: apps/v1
kind: Deployment
metadata:
  name: recurring-task-service
  namespace: todo-app
  labels:
    app: recurring-task-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recurring-task-service
  template:
    metadata:
      labels:
        app: recurring-task-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "recurring-task-service"
        dapr.io/app-port: "8001"
    spec:
      containers:
      - name: service
        image: recurring-task-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: BACKEND_API_URL
          value: "http://todo-chatbot-backend:8000"
        - name: DAPR_HTTP_PORT
          value: "3500"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recurring-task-service
  namespace: todo-app
spec:
  selector:
    app: recurring-task-service
  ports:
  - port: 8001
    targetPort: 8001

