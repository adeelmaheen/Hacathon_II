name: Deploy to Oracle Cloud OKE

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'helm/**'
      - '.github/workflows/deploy-oke.yml'
  workflow_dispatch:

env:
  REGISTRY: <region>.ocir.io/<tenancy-namespace>/todo-chatbot
  # OR: <your-dockerhub-username>
  CLUSTER_NAME: todo-chatbot-cluster
  NAMESPACE: todo-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }},${{ env.REGISTRY }}/backend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/backend:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }},${{ env.REGISTRY }}/frontend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/frontend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure OCI CLI
        uses: oracle-actions/setup-oci-cli@v1
        with:
          cli-version: latest
          config-file-content: ${{ secrets.OCI_CONFIG }}

      - name: Configure kubectl
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.CLUSTER_OCID }} \
            --file $HOME/.kube/config \
            --region ${{ secrets.OCI_REGION }} \
            --token-version 2.0.0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Deploy with Helm
        run: |
          cd helm/todo-chatbot
          helm upgrade --install todo-chatbot . \
            -n ${{ env.NAMESPACE }} \
            --create-namespace \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }}

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}

